<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">German Credit · 多指标分组柱状图 / Grouped multi-metric bar chart</title>
<desc id="desc">Six zero-to-one metrics compare Majority, Zero-shot, Logistic Regression, SFT, and Multi-SFT. Up arrows mean higher is better; down arrows mean lower is better. Zero values are drawn as short baseline marks.</desc>
