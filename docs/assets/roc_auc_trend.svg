<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">German Credit ROC-AUC trend</title>
  <desc id="desc">Qwen3.5-4B improves from 0.515 zero-shot to 0.747 after LoRA SFT, while multi-dataset SFT scores 0.720. Logistic Regression provides a 0.757 reference line.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="72" y="36" fill="#111111" font-family="system-ui, sans-serif" font-size="22" font-weight="700">German Credit · ROC-AUC</text>
  <text x="72" y="58" fill="#666666" font-family="system-ui, sans-serif" font-size="13">Qwen adaptation path with Logistic Regression as the fixed reference</text>

  <g stroke="#e1e1de" stroke-width="1">
    <line x1="88" y1="300" x2="888" y2="300"/>
    <line x1="88" y1="220" x2="888" y2="220"/>
    <line x1="88" y1="140" x2="888" y2="140"/>
    <line x1="88" y1="60" x2="888" y2="60"/>
  </g>
  <g fill="#666666" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">
    <text x="76" y="304">0.50</text>
    <text x="76" y="224">0.60</text>
    <text x="76" y="144">0.70</text>
    <text x="76" y="64">0.80</text>
  </g>

  <line x1="88" y1="340" x2="888" y2="340" stroke="#111111" stroke-width="1.5"/>
  <line x1="88" y1="60" x2="88" y2="340" stroke="#111111" stroke-width="1.5"/>

  <line x1="88" y1="94" x2="888" y2="94" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="884" y="86" fill="#555555" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Logistic Regression 0.757</text>

  <polyline points="160,288 480,102 800,124" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="160" cy="288" r="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="160" y="274" fill="#111111" font-size="14" font-weight="700">0.515</text>
    <text x="160" y="366" fill="#111111" font-size="13" font-weight="600">Zero-shot</text>

    <circle cx="480" cy="102" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="480" cy="102" r="10.5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="84" fill="#2563eb" font-size="15" font-weight="800">0.747</text>
    <text x="480" y="366" fill="#111111" font-size="13" font-weight="600">LoRA SFT · seed 7</text>

    <circle cx="800" cy="124" r="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="800" y="110" fill="#111111" font-size="14" font-weight="700">0.720</text>
    <text x="800" y="366" fill="#111111" font-size="13" font-weight="600">Multi-SFT · German</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <path d="M 185 260 C 270 190, 350 130, 445 108" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="300" y="168" fill="#2563eb" font-size="14" font-weight="800">+0.232 after SFT</text>
  </g>

  <text x="88" y="402" fill="#777777" font-family="system-ui, sans-serif" font-size="11">Source: committed C7 prediction artifacts; decision thresholds are selected on validation data only.</text>
</svg>
