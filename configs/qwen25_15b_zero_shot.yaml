# B2: Qwen2.5-1.5B-Instruct Zero-shot Configuration
model:
  id: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device: "cuda"

scoring:
  method: "token_logprob"
  candidate_labels: ["low risk", "high risk"]
  normalization: "softmax"

threshold:
  method: "cost_minimization"
  fn_cost: 5
  fp_cost: 1
  search_grid: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]

evaluation:
  valid_set: "data/processed/german/sft/valid.jsonl"
  test_set: "data/processed/german/sft/test.jsonl"
  output_dir: "outputs/baselines"
