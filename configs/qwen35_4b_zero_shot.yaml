# B2: Qwen3.5-4B zero-shot configuration
model:
  # Override the environment-specific default with RISK_CONTROL_MODEL_ID.
  id: "/data/share/model/Qwen3.5-4B"
  dtype: "bfloat16"
  device: "cuda"

scoring:
  method: "first_token_class_logprob"
  candidate_labels: ["low", "high"]
  normalization: "two_class_softmax"
  note: "This is not the conditional likelihood of the complete label strings."

threshold:
  method: "cost_minimization"
  fn_cost: 5
  fp_cost: 1
  split: "validation_only"
  search_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

evaluation:
  valid_set: "data/processed/german/sft/valid.jsonl"
  test_set: "data/processed/german/sft/test.jsonl"
  output_dir: "outputs/baselines"
