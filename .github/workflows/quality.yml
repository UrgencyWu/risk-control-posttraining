name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install evaluation dependencies
        run: python -m pip install --upgrade pip -r requirements-eval.txt
      - name: Compile project modules
        run: python -m compileall -q src convert_german.py
      - name: Run data and leakage-regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate interactive showcase script
        run: node --check docs/assets/showcase.js
      - name: Reproduce committed C7 metrics
        run: |
          python -m src.evaluation.c7_final --output /tmp/c7_final_metrics.json
          cmp --silent outputs/c7_final_metrics.json /tmp/c7_final_metrics.json
